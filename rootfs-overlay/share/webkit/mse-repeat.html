<!doctype html>
<meta charset="utf-8">
<title>xv6 repeated MSE playback probe</title>
<video id="v" muted autoplay playsinline controls width="640" height="360"></video>
<pre id="out"></pre>
<script>
(async () => {
  const out = document.getElementById("out");
  const video = document.getElementById("v");
  const lines = [];
  function log(line) {
    lines.push(line);
    console.log("MSE-REPEAT " + line);
    out.textContent = lines.join("\n");
  }
  function ranges(r) {
    const a = [];
    for (let i = 0; i < r.length; i++)
      a.push(r.start(i).toFixed(3) + "-" + r.end(i).toFixed(3));
    return a.join("|");
  }
  function state(tag) {
    log(tag + " paused=" + video.paused + " ready=" + video.readyState +
      " network=" + video.networkState + " time=" + video.currentTime.toFixed(3) +
      " duration=" + video.duration + " buffered=" + ranges(video.buffered) +
      " error=" + (video.error ? video.error.code : 0));
  }
  try {
    const type = 'video/webm;codecs="vp9,opus"';
    log("supported=" + MediaSource.isTypeSupported(type));
    const response = await fetch("test-mse.webm");
    const bytes = await response.arrayBuffer();
    log("fetched status=" + response.status + " bytes=" + bytes.byteLength);
    const mediaSource = new MediaSource();
    video.src = URL.createObjectURL(mediaSource);
    await new Promise((resolve, reject) => {
      mediaSource.addEventListener("sourceopen", resolve, { once: true });
      mediaSource.addEventListener("error", reject, { once: true });
    });
    const sourceBuffer = mediaSource.addSourceBuffer(type);
    const segmentDuration = 2.0505;
    for (let i = 0; i < 8; i++) {
      sourceBuffer.timestampOffset = i * segmentDuration;
      await new Promise((resolve, reject) => {
        sourceBuffer.addEventListener("updateend", resolve, { once: true });
        sourceBuffer.addEventListener("error", reject, { once: true });
        sourceBuffer.appendBuffer(bytes);
      });
      log("append" + i + " buffered=" + ranges(video.buffered));
    }
    mediaSource.duration = 8 * segmentDuration;
    mediaSource.endOfStream();
    state("before-play");
    await video.play();
    log("play-promise=resolved");
    const start = video.currentTime;
    for (let i = 0; i < 28; i++) {
      await new Promise(resolve => setTimeout(resolve, 500));
      state("tick" + i);
    }
    log("RESULT " + (video.currentTime > start + 8 && !video.error ? "pass" : "fail"));
  } catch (e) {
    log("RESULT fail exception=" + e.name + ":" + e.message);
  }
})();
</script>
