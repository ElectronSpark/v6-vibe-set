<!doctype html>
<meta charset="utf-8">
<title>xv6 fullscreen video perf</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #v { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; background: #000; }
  #hud { position: fixed; left: 8px; bottom: 8px; margin: 0; color: #0f0;
         font: 14px/1.3 monospace; background: rgba(0,0,0,0.55); padding: 6px 8px;
         white-space: pre; z-index: 10; }
</style>
<video id="v" muted autoplay playsinline></video>
<pre id="hud">boot</pre>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const asset = params.get("asset") || "perf-1280x800-60fps.mp4";
  const resolvedAsset = new URL(asset, location.href).href;
  const runMs = parseInt(params.get("ms") || "15000", 10);
  let startupMs = parseInt(params.get("startupMs") || "8000", 10);
  if (!Number.isFinite(startupMs) || startupMs < 0) startupMs = 8000;
  if (startupMs > 60000) startupMs = 60000;
  let postFailObserveMs = parseInt(params.get("postFailObserveMs") || "0", 10);
  if (!Number.isFinite(postFailObserveMs) || postFailObserveMs < 0) postFailObserveMs = 0;
  if (postFailObserveMs > 60000) postFailObserveMs = 60000;
  const showHud = params.get("hud") !== "0";
  const skipCanPlay = params.get("skipCanPlay") === "1";
  const video = document.getElementById("v");
  const hud = document.getElementById("hud");
  const lines = [];
  let presented = 0;
  let firstTs = 0, lastTs = 0, lastMediaTime = 0;
  let firstMediaTime = 0, previousTs = 0, previousMediaTime = 0;
  let rvfcGapSamples = 0, rvfcGapTotalMs = 0, rvfcMaxGapMs = 0;
  let rvfcMediaGapTotal = 0, rvfcMaxMediaGap = 0;
  let lastMetaPresentedFrames = -1;
  let seq = 0;
  function log(line) {
    lines.push(line);
    document.title = "xv6-perf-video:" + line.slice(0, 110);
    console.log("PERF-VIDEO " + line);
  }
  function phase(name, extra) {
    log("phase seq=" + (++seq) + " name=" + name +
        (extra ? " " + extra : ""));
  }
  function schedulePhase(delayMs, name) {
    setTimeout(() => phase(name, videoState()), delayMs);
  }
  function describeCanPlay(type) {
    try {
      return video.canPlayType(type) || "(empty)";
    } catch (e) {
      return "throw:" + e.name + ":" + e.message;
    }
  }
  if (!showHud) hud.style.display = "none";
  function hudset(s) { if (showHud) hud.textContent = s; }
  function videoState() {
    const q = (typeof video.getVideoPlaybackQuality === "function")
      ? video.getVideoPlaybackQuality() : null;
    return "ready=" + video.readyState +
      " net=" + video.networkState +
      " paused=" + (video.paused ? 1 : 0) +
      " seeking=" + (video.seeking ? 1 : 0) +
      " time=" + video.currentTime.toFixed(3) +
      " duration=" + (isFinite(video.duration) ? video.duration.toFixed(3) : "nan") +
      " src=" + (video.getAttribute("src") || "(empty)") +
      " currentSrc=" + (video.currentSrc || "(empty)") +
      " presented=" + presented +
      " decoded=" + (q ? q.totalVideoFrames : -1) +
      " dropped=" + (q ? q.droppedVideoFrames : -1) +
      " err=" + (video.error ? video.error.code : 0);
  }
  function rvfcSummaryLine(prefix) {
    const spanMs = firstTs && lastTs ? (lastTs - firstTs) : 0;
    const avgGapMs = rvfcGapSamples > 0 ? rvfcGapTotalMs / rvfcGapSamples : 0;
    const avgMediaGap = rvfcGapSamples > 0 ? rvfcMediaGapTotal / rvfcGapSamples : 0;
    const mediaSpan = presented > 0 ? (lastMediaTime - firstMediaTime) : 0;
    return prefix +
      " count=" + presented +
      " firstWallMs=" + (firstTs || 0).toFixed(3) +
      " lastWallMs=" + (lastTs || 0).toFixed(3) +
      " spanMs=" + spanMs.toFixed(3) +
      " avgGapMs=" + avgGapMs.toFixed(3) +
      " maxGapMs=" + rvfcMaxGapMs.toFixed(3) +
      " firstMedia=" + firstMediaTime.toFixed(3) +
      " lastMedia=" + lastMediaTime.toFixed(3) +
      " mediaSpan=" + mediaSpan.toFixed(3) +
      " avgMediaGap=" + avgMediaGap.toFixed(4) +
      " maxMediaGap=" + rvfcMaxMediaGap.toFixed(4) +
      " lastMetaPresentedFrames=" + lastMetaPresentedFrames;
  }
  function rvfcMetricFields() {
    const spanMs = firstTs && lastTs ? (lastTs - firstTs) : 0;
    const avgGapMs = rvfcGapSamples > 0 ? rvfcGapTotalMs / rvfcGapSamples : 0;
    const avgMediaGap = rvfcGapSamples > 0 ? rvfcMediaGapTotal / rvfcGapSamples : 0;
    const mediaSpan = presented > 0 ? (lastMediaTime - firstMediaTime) : 0;
    return " rvfcCount=" + presented +
      " rvfcSpanMs=" + spanMs.toFixed(3) +
      " rvfcAvgGapMs=" + avgGapMs.toFixed(3) +
      " rvfcMaxGapMs=" + rvfcMaxGapMs.toFixed(3) +
      " rvfcLastMedia=" + lastMediaTime.toFixed(3) +
      " rvfcMediaSpan=" + mediaSpan.toFixed(3) +
      " rvfcMetaPresentedFrames=" + lastMetaPresentedFrames;
  }
  function logRvfcSummary(prefix) {
    log(rvfcSummaryLine(prefix || "rvfc-summary"));
  }
  function logTick(kind, wallSec, dPres, instFps) {
    const q = (typeof video.getVideoPlaybackQuality === "function")
      ? video.getVideoPlaybackQuality() : null;
    const total = q ? q.totalVideoFrames : -1;
    const dropped = q ? q.droppedVideoFrames : -1;
    const paused = video.paused ? 1 : 0;
    const ended = video.ended ? 1 : 0;
    const errorCode = video.error ? video.error.code : 0;
    log(kind + " wall=" + wallSec.toFixed(2) +
        " time=" + video.currentTime.toFixed(3) +
        " ready=" + video.readyState + " net=" + video.networkState +
        " paused=" + paused + " ended=" + ended +
        " presented=" + presented + " dPresented=" + dPres +
        " instFPS=" + instFps.toFixed(2) +
        " decoded=" + total + " dropped=" + dropped +
        " visibility=" + document.visibilityState +
        " err=" + errorCode +
        rvfcMetricFields());
    document.title = "xv6-perf-video:" + kind + " time=" +
      video.currentTime.toFixed(2) + " presented=" + presented +
      " decoded=" + total + " err=" + errorCode;
    hudset(
      "asset=" + resolvedAsset + "\n" +
      "media=" + video.currentTime.toFixed(2) + "s / " + (video.duration || 0).toFixed(2) + "s\n" +
      "presented=" + presented + " instFPS=" + instFps.toFixed(1) + "\n" +
      "decoded=" + total + " dropped=" + dropped + "\n" +
      "wall=" + wallSec.toFixed(1) + "s err=" + errorCode);
  }
  async function observeAfterFailure(ms, startedAt, reason) {
    if (ms <= 0) return;
    const observeT0 = performance.now();
    let lastPresented = presented;
    let lastPoll = observeT0;
    log("postfail-observe start reason=" + reason + " observeMs=" + ms +
        " wall=" + ((observeT0 - startedAt) / 1000).toFixed(2) + " " +
        videoState());
    while (performance.now() - observeT0 < ms) {
      await new Promise(r => setTimeout(r, 500));
      const nowp = performance.now();
      const wallSec = (nowp - startedAt) / 1000;
      const dPres = presented - lastPresented;
      const dWall = (nowp - lastPoll) / 1000;
      const instFps = dWall > 0 ? dPres / dWall : 0;
      lastPresented = presented;
      lastPoll = nowp;
      logTick("postfail-tick", wallSec, dPres, instFps);
    }
    logRvfcSummary("rvfc-summary-postfail");
    log("postfail-observe done reason=" + reason + " observeMs=" + ms +
        " wall=" + ((performance.now() - startedAt) / 1000).toFixed(2) +
        " " + videoState());
  }

  ["loadstart", "loadedmetadata", "loadeddata", "canplay", "playing",
   "waiting", "stalled", "pause", "ended", "error"].forEach(ev => {
    video.addEventListener(ev, () => log("event:" + ev + " " + videoState()));
  });
  window.onerror = (message, source, lineno, colno) => {
    log("page-error message=" + message + " source=" + source +
        " line=" + lineno + " column=" + colno + " " + videoState());
  };
  window.onunhandledrejection = ev => {
    const reason = ev && ev.reason ? ev.reason : "(unknown)";
    log("page-unhandledrejection reason=" + reason + " " + videoState());
  };

  // requestVideoFrameCallback measures genuine presented frames.
  const haveRVFC = typeof video.requestVideoFrameCallback === "function";
  function onFrame(now, meta) {
    presented++;
    const mediaTime = Number.isFinite(meta.mediaTime)
      ? meta.mediaTime : video.currentTime;
    if (!firstTs) {
      firstTs = now;
      firstMediaTime = mediaTime;
    }
    let currentGapMs = 0;
    if (previousTs) {
      const gapMs = now - previousTs;
      const mediaGap = mediaTime - previousMediaTime;
      currentGapMs = gapMs;
      rvfcGapSamples++;
      rvfcGapTotalMs += gapMs;
      rvfcMediaGapTotal += mediaGap;
      if (gapMs > rvfcMaxGapMs) rvfcMaxGapMs = gapMs;
      if (mediaGap > rvfcMaxMediaGap) rvfcMaxMediaGap = mediaGap;
    }
    lastTs = now;
    lastMediaTime = mediaTime;
    previousTs = now;
    previousMediaTime = mediaTime;
    lastMetaPresentedFrames = Number.isFinite(meta.presentedFrames)
      ? meta.presentedFrames : -1;
    if (presented <= 5 || (presented % 30) === 0 || currentGapMs > 250) {
      const expected = Number.isFinite(meta.expectedDisplayTime)
        ? meta.expectedDisplayTime.toFixed(3) : "nan";
      const width = Number.isFinite(meta.width) ? meta.width : -1;
      const height = Number.isFinite(meta.height) ? meta.height : -1;
      log("rvfc seq=" + presented +
          " nowMs=" + now.toFixed(3) +
          " mediaTime=" + mediaTime.toFixed(3) +
          " expectedDisplayMs=" + expected +
          " metaPresentedFrames=" + lastMetaPresentedFrames +
          " width=" + width + " height=" + height);
    }
    video.requestVideoFrameCallback(onFrame);
  }

  try {
    phase("before-src", "asset=" + asset + " resolvedAsset=" + resolvedAsset);
    if (skipCanPlay) {
      phase("canplay-skip", "skipCanPlay=1");
    } else {
      phase("canplay-query-begin");
      const canPlayMp4 = describeCanPlay("video/mp4");
      phase("canplay-query-mp4-done", "mp4=" + canPlayMp4);
      const canPlayBaseline = describeCanPlay('video/mp4; codecs="avc1.42E01E"');
      phase("canplay-query-baseline-done", "h264_baseline=" + canPlayBaseline);
      const canPlayMainAac = describeCanPlay('video/mp4; codecs="avc1.4D401E, mp4a.40.2"');
      phase("canplay-query-main-aac-done", "h264_main_aac=" + canPlayMainAac);
      const mse = (window.MediaSource && typeof window.MediaSource.isTypeSupported === "function")
        ? window.MediaSource.isTypeSupported('video/mp4; codecs="avc1.42E01E, mp4a.40.2"')
        : "missing";
      phase("canplay-query-mse-done", "mse=" + mse);
      log("canplay mp4=" + canPlayMp4 +
          " h264_baseline=" + canPlayBaseline +
          " h264_main_aac=" + canPlayMainAac +
          " mse=" + mse);
    }
    phase("fetch-begin", "url=" + resolvedAsset);
    fetch(resolvedAsset, { cache: "no-store" }).then(r => {
      log("fetch-result ok=" + (r.ok ? 1 : 0) +
          " status=" + r.status +
          " type=" + r.type +
          " url=" + r.url);
      return r.arrayBuffer();
    }).then(b => {
      log("fetch-bytes byteLength=" + b.byteLength + " " + videoState());
    }).catch(e => {
      log("fetch-error name=" + e.name + " message=" + e.message + " " + videoState());
    });
    Promise.resolve().then(() => phase("microtask-before-src", videoState()));
    video.preload = "auto";
    video.src = resolvedAsset;
    phase("after-src", videoState());
    schedulePhase(0, "timer-after-src-0");
    schedulePhase(100, "timer-after-src-100");
    video.load();
    phase("after-load-call", videoState());
    Promise.resolve().then(() => phase("microtask-after-load", videoState()));
    schedulePhase(0, "timer-after-load-0");
    schedulePhase(100, "timer-after-load-100");
    schedulePhase(1000, "timer-after-load-1000");
    log("start asset=" + asset + " resolvedAsset=" + resolvedAsset + " rvfc=" + haveRVFC +
        " runMs=" + runMs + " startupMs=" + startupMs +
        " postFailObserveMs=" + postFailObserveMs);
    if (haveRVFC) video.requestVideoFrameCallback(onFrame);
    const startupT0 = performance.now();
    let playDone = false;
    let playRejected = null;
    const startupTimer = setInterval(() => {
      const wallSec = (performance.now() - startupT0) / 1000;
      const state = videoState();
      log("startup wall=" + wallSec.toFixed(2) + " " + state);
      hudset("startup=" + wallSec.toFixed(1) + "s\n" + state);
    }, 1000);
    phase("before-play", videoState());
    const playPromise = video.play();
    phase("after-play-call", videoState());
    Promise.resolve().then(() => phase("microtask-after-play", videoState()));
    schedulePhase(0, "timer-after-play-0");
    schedulePhase(100, "timer-after-play-100");
    schedulePhase(1000, "timer-after-play-1000");
    playPromise.then(() => {
      playDone = true;
      phase("after-play-resolved", videoState());
      log("play-resolved wall=" +
          ((performance.now() - startupT0) / 1000).toFixed(2) + " " +
          videoState());
    }).catch(e => {
      playDone = true;
      playRejected = e;
      phase("after-play-rejected", "exception=" + e.name + ":" + e.message);
      log("play-rejected wall=" +
          ((performance.now() - startupT0) / 1000).toFixed(2) +
          " exception=" + e.name + ":" + e.message + " " + videoState());
    });
    await Promise.race([
      playPromise,
      new Promise(r => setTimeout(r, startupMs))
    ]);
    clearInterval(startupTimer);
    if (playRejected)
      throw playRejected;
    if (!playDone) {
      log("RESULT fail startup-timeout phase=play-promise startupMs=" +
          startupMs + " " + videoState());
      await observeAfterFailure(postFailObserveMs, startupT0, "startup-timeout");
      return;
    }
    if (video.requestFullscreen) { try { await video.requestFullscreen(); } catch (e) {} }
    const startMedia = video.currentTime;
    const t0 = performance.now();
    let lastPresented = 0, lastPoll = t0;

    while (performance.now() - t0 < runMs) {
      await new Promise(r => setTimeout(r, 500));
      const nowp = performance.now();
      const wallSec = (nowp - t0) / 1000;
      const dPres = presented - lastPresented;
      const dWall = (nowp - lastPoll) / 1000;
      const instFps = dWall > 0 ? dPres / dWall : 0;
      lastPresented = presented; lastPoll = nowp;
      logTick("tick", wallSec, dPres, instFps);
    }

    const wallSec = (performance.now() - t0) / 1000;
    const advanced = video.currentTime - startMedia;
    const q = (typeof video.getVideoPlaybackQuality === "function")
      ? video.getVideoPlaybackQuality() : null;
    const total = q ? q.totalVideoFrames : 0;
    const dropped = q ? q.droppedVideoFrames : 0;
    const dropPct = (total > 0) ? (100 * dropped / total) : 0;
    // Several independent FPS estimates so the gate works regardless of which
    // WebKitGTK metrics API is populated:
    //  presentedFps - real composited frames via requestVideoFrameCallback
    //  decodedFps   - frames the pipeline decoded via getVideoPlaybackQuality
    //  realtimeFps  - nominal 60fps scaled by how close playback held real time
    const presentedFps = wallSec > 0 ? presented / wallSec : 0;
    const decodedFps = wallSec > 0 ? total / wallSec : 0;
    const speed = wallSec > 0 ? advanced / wallSec : 0; // 1.0 == perfect real time
    const realtimeFps = 60 * speed;
    // Best available measured FPS for the headline number.
    const fps = presentedFps > 1 ? presentedFps
              : (decodedFps > 1 ? decodedFps : realtimeFps);
    log("metrics presented=" + presented + " presentedFPS=" + presentedFps.toFixed(2) +
        " decoded=" + total + " decodedFPS=" + decodedFps.toFixed(2) +
        " dropped=" + dropped + " dropPct=" + dropPct.toFixed(2) +
        " advanced=" + advanced.toFixed(2) + " speed=" + speed.toFixed(3) +
        " wall=" + wallSec.toFixed(2));
    logRvfcSummary("rvfc-summary");

    // Pass: playback held real time (>=0.9x), no decode error, low drop rate.
    const pass = (speed >= 0.9) && !video.error && (dropPct < 10);
    log("RESULT " + (pass ? "pass" : "fail") +
        " fps=" + fps.toFixed(1) + " speed=" + speed.toFixed(3) +
        " presentedFPS=" + presentedFps.toFixed(1) +
        " decodedFPS=" + decodedFps.toFixed(1) +
        " dropPct=" + dropPct.toFixed(2) + " advanced=" + advanced.toFixed(2));
  } catch (e) {
    log("RESULT fail exception=" + e.name + ":" + e.message);
  }
})();
</script>
