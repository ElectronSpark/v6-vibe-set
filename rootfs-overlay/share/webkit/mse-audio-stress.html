<!doctype html>
<meta charset="utf-8">
<title>xv6 audio MSE stress probe</title>
<audio id="v" muted autoplay controls></audio>
<pre id="out"></pre>
<script>
(async () => {
  const out = document.getElementById("out");
  const audio = document.getElementById("v");
  const params = new URLSearchParams(location.search);
  const repeats = Number(params.get("repeats") || "32");
  const fast = params.get("fast") !== "0";
  const lines = [];
  function log(line) {
    lines.push(line);
    console.log("MSE-AUDIO-STRESS " + line);
    out.textContent = lines.join("\n");
  }
  function ranges(r) {
    const a = [];
    for (let i = 0; i < r.length; i++)
      a.push(r.start(i).toFixed(3) + "-" + r.end(i).toFixed(3));
    return a.join("|");
  }
  function state(tag) {
    log(tag + " paused=" + audio.paused + " ready=" + audio.readyState +
      " network=" + audio.networkState + " time=" + audio.currentTime.toFixed(3) +
      " duration=" + audio.duration + " buffered=" + ranges(audio.buffered) +
      " error=" + (audio.error ? audio.error.code : 0));
  }
  for (const ev of ["loadstart", "loadedmetadata", "loadeddata", "canplay",
    "playing", "waiting", "stalled", "timeupdate", "pause", "ended", "error"])
    audio.addEventListener(ev, () => state("event:" + ev));
  try {
    const type = 'audio/webm;codecs="opus"';
    log("supported=" + MediaSource.isTypeSupported(type) + " repeats=" + repeats);
    const response = await fetch("test-mse-audio.webm");
    const bytes = await response.arrayBuffer();
    log("fetched status=" + response.status + " bytes=" + bytes.byteLength);
    const mediaSource = new MediaSource();
    audio.src = URL.createObjectURL(mediaSource);
    await new Promise((resolve, reject) => {
      mediaSource.addEventListener("sourceopen", resolve, { once: true });
      mediaSource.addEventListener("error", reject, { once: true });
    });
    const sourceBuffer = mediaSource.addSourceBuffer(type);
    const segmentDuration = 2.0;
    for (let i = 0; i < repeats; i++) {
      sourceBuffer.timestampOffset = i * segmentDuration;
      await new Promise((resolve, reject) => {
        sourceBuffer.addEventListener("updateend", resolve, { once: true });
        sourceBuffer.addEventListener("error", reject, { once: true });
        sourceBuffer.appendBuffer(bytes);
      });
      log("append" + i + " buffered=" + ranges(audio.buffered));
      if (!fast)
        await new Promise(resolve => setTimeout(resolve, 20));
    }
    const finalBufferedEnd = audio.buffered.length ? audio.buffered.end(audio.buffered.length - 1) : repeats * segmentDuration;
    mediaSource.duration = finalBufferedEnd + 0.25;
    mediaSource.endOfStream();
    state("before-play");
    await audio.play();
    log("play-promise=resolved");
    const start = audio.currentTime;
    for (let i = 0; i < 36; i++) {
      await new Promise(resolve => setTimeout(resolve, 500));
      state("tick" + i);
    }
    log("RESULT " + (audio.currentTime > start + 10 && !audio.error ? "pass" : "fail"));
  } catch (e) {
    log("RESULT fail exception=" + e.name + ":" + e.message);
  }
})();
</script>
