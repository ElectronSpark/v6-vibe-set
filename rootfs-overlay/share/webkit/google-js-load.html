<!doctype html>
<meta charset="utf-8">
<title>Google JS load fixture</title>
<script>
window.__xv6Fixture = { steps: [], errors: [] };
function mark(step, detail) {
    const entry = step + ":" + Date.now() + (detail ? ":" + detail : "");
    window.__xv6Fixture.steps.push(entry);
    console.log("XV6-GJS " + entry);
}
window.addEventListener("error", event => {
    const detail = (event.message || "error") + "@" + (event.filename || "") + ":" + (event.lineno || 0);
    window.__xv6Fixture.errors.push(detail);
    console.log("XV6-GJS error:" + detail);
});
window.addEventListener("unhandledrejection", event => {
    const detail = String(event.reason || "rejection");
    window.__xv6Fixture.errors.push(detail);
    console.log("XV6-GJS rejection:" + detail);
});
mark("head-start");
</script>
<script src="https://www.google.com/js/th/yqOMqMYRWkkqf4l8pyNeJmWa9uQrA2AcMbOqoN_XdQg.js"></script>
<script>
mark("after-script");
Promise.resolve().then(() => mark("microtask"));
setTimeout(() => mark("timeout-0"), 0);
setTimeout(() => mark("timeout-1000"), 1000);
</script>
<body>
<main>
  <h1>Google JS load fixture</h1>
  <p id="status">Loaded</p>
</main>
</body>
