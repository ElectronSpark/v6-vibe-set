<!doctype html>
<meta charset="utf-8">
<title>xv6 media codec step probe</title>
<pre id="log">boot</pre>
<script>
(function () {
  var logNode = document.getElementById("log");
  var events = [];
  var video = document.createElement("video");
  var audio = document.createElement("audio");
  var types = [
    "video/mp4",
    "video/mp4; codecs=\"avc1.42E01E, mp4a.40.2\"",
    "video/mp4; codecs=\"avc1.4D401E, mp4a.40.2\"",
    "video/webm",
    "video/webm; codecs=\"vp8, vorbis\"",
    "video/webm; codecs=\"vp9, opus\"",
    "audio/mp4",
    "audio/mp4; codecs=\"mp4a.40.2\"",
    "audio/webm",
    "audio/webm; codecs=\"opus\"",
    "audio/ogg; codecs=\"vorbis\""
  ];

  function q(s) {
    return "\"" + String(s).replace(/\\/g, "\\\\").replace(/"/g, "\\\"") + "\"";
  }

  function log(msg) {
    events.push(msg);
    logNode.textContent = events.join("\n");
    document.title = "xv6-media-codec-step:" + msg.slice(0, 512);
    console.log("XV6-STEP " + msg);
  }

  function call(label, fn) {
    log("before " + label);
    try {
      var value = fn();
      log("after " + label + " value=" + q(value));
      return value;
    } catch (e) {
      log("throw " + label + " name=" + e.name + " message=" + q(e.message || ""));
      return "throw:" + e.name;
    }
  }

  window.__xv6Fixture = { name: "media-codecs-step", events: events };
  log("boot canPlayType=" + typeof video.canPlayType +
      " MediaSource=" + typeof window.MediaSource +
      " mediaCapabilities=" + typeof navigator.mediaCapabilities);

  types.forEach(function (type, index) {
    var media = type.indexOf("audio/") === 0 ? audio : video;
    var label = index + " " + type;
    var canPlay = call("canPlayType " + label, function () {
      return media.canPlayType(type);
    });
    var mse = "missing";
    if (window.MediaSource && typeof window.MediaSource.isTypeSupported === "function") {
      mse = call("mse " + label, function () {
        return String(window.MediaSource.isTypeSupported(type));
      });
    }
    log("summary " + index + " type=" + q(type) +
        " canPlayType=" + q(canPlay) + " mse=" + q(mse));
  });

  window.setTimeout(function () {
    log("RESULT pass count=" + events.length);
  }, 500);
  window.setTimeout(function () {
    log("WATCHDOG count=" + events.length);
  }, 5000);
})();
</script>
