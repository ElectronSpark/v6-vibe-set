<!doctype html>
<meta charset="utf-8">
<title>xv6 native present animated content pending</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101820;
}
canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}
</style>
<canvas id="scene"></canvas>
<script>
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
let frame = 0;

function resize() {
  canvas.width = Math.max(320, window.innerWidth);
  canvas.height = Math.max(240, window.innerHeight);
}

function draw() {
  const w = canvas.width;
  const h = canvas.height;
  const t = frame * 0.035;
  ctx.fillStyle = "#101820";
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 9; i++) {
    const x = w * (0.12 + i * 0.095);
    const y = h * (0.52 + Math.sin(t + i * 0.7) * 0.22);
    const r = 18 + (i % 3) * 9;
    ctx.fillStyle = i % 2 ? "#f2aa4c" : "#7bdff2";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "#e8edf2";
  ctx.font = "20px sans-serif";
  ctx.fillText("xv6 native-present content frame " + frame, 24, 36);
  document.title = "xv6 native present animated content frame " + frame;
  frame++;
  requestAnimationFrame(draw);
}

window.addEventListener("resize", resize);
resize();
draw();
</script>
