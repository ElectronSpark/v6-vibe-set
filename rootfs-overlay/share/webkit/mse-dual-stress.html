<!doctype html>
<meta charset="utf-8">
<title>xv6 dual MSE stress probe</title>
<video id="v" muted autoplay playsinline controls width="640" height="360"></video>
<pre id="out"></pre>
<script>
(async () => {
  const out = document.getElementById("out");
  const video = document.getElementById("v");
  const params = new URLSearchParams(location.search);
  function unsignedParam(name, fallback, max) {
    const value = Number(params.get(name));
    if (!Number.isFinite(value) || value < 0)
      return fallback;
    return Math.min(Math.floor(value), max);
  }
  const audioRepeats = unsignedParam("audio", 32, 128);
  const videoRepeats = unsignedParam("video", 10, 128);
  const pressure = unsignedParam("pressure", 0, 16);
  const lines = [];
  let keepPressure = true;
  function log(line) {
    lines.push(line);
    console.log("MSE-DUAL " + line);
    out.textContent = lines.join("\n");
  }
  function ranges(r) {
    const a = [];
    for (let i = 0; i < r.length; i++)
      a.push(r.start(i).toFixed(3) + "-" + r.end(i).toFixed(3));
    return a.join("|");
  }
  function state(tag) {
    log(tag + " paused=" + video.paused + " ready=" + video.readyState +
      " network=" + video.networkState + " time=" + video.currentTime.toFixed(3) +
      " duration=" + video.duration + " buffered=" + ranges(video.buffered) +
      " error=" + (video.error ? video.error.code : 0));
  }
  function bufferEnd(sourceBuffer) {
    try {
      const r = sourceBuffer.buffered;
      return r.length ? r.end(r.length - 1) : 0;
    } catch (e) {
      return 0;
    }
  }
  async function fetchLoop(id) {
    let n = 0;
    while (keepPressure) {
      try {
        const response = await fetch("google-js-load.html?worker=" + id + "&n=" + n + "&t=" + Date.now(), { cache: "no-store" });
        await response.text();
      } catch (e) {
        log("pressure" + id + " error=" + e.name);
      }
      n++;
      await new Promise(resolve => setTimeout(resolve, 5));
    }
  }
  function cpuBurst() {
    if (!keepPressure)
      return;
    const deadline = Date.now() + 12;
    let x = 0;
    while (Date.now() < deadline)
      x = (x + Math.sqrt(x + 7)) % 1000;
    setTimeout(cpuBurst, 4);
  }
  for (const ev of ["loadstart", "loadedmetadata", "loadeddata", "canplay",
    "playing", "waiting", "stalled", "timeupdate", "pause", "ended", "error"])
    video.addEventListener(ev, () => state("event:" + ev));
  try {
    const audioType = 'audio/webm; codecs="opus"';
    const videoType = 'video/webm; codecs="vp9,opus"';
    log("supported audio=" + MediaSource.isTypeSupported(audioType) +
        " video=" + MediaSource.isTypeSupported(videoType) +
        " audioRepeats=" + audioRepeats + " videoRepeats=" + videoRepeats +
        " pressure=" + pressure);
    if (!MediaSource.isTypeSupported(audioType) || !MediaSource.isTypeSupported(videoType))
      throw new Error("required MSE types unsupported");
    for (let i = 0; i < pressure; i++)
      fetchLoop(i);
    if (pressure)
      cpuBurst();
    const [audioResponse, videoResponse] = await Promise.all([
      fetch("test-mse-audio.webm"),
      fetch("test-mse.webm")
    ]);
    const [audioBytes, videoBytes] = await Promise.all([
      audioResponse.arrayBuffer(),
      videoResponse.arrayBuffer()
    ]);
    log("fetched audio=" + audioResponse.status + "/" + audioBytes.byteLength +
        " video=" + videoResponse.status + "/" + videoBytes.byteLength);
    const mediaSource = new MediaSource();
    video.src = URL.createObjectURL(mediaSource);
    await new Promise((resolve, reject) => {
      mediaSource.addEventListener("sourceopen", resolve, { once: true });
      mediaSource.addEventListener("error", reject, { once: true });
    });
    const audioBuffer = mediaSource.addSourceBuffer(audioType);
    const videoBuffer = mediaSource.addSourceBuffer(videoType);
    const audioDuration = 2.0;
    const videoDuration = 2.0505;
    for (let i = 0; i < Math.max(audioRepeats, videoRepeats); i++) {
      if (i < audioRepeats) {
        audioBuffer.timestampOffset = i * audioDuration;
        await new Promise((resolve, reject) => {
          audioBuffer.addEventListener("updateend", resolve, { once: true });
          audioBuffer.addEventListener("error", reject, { once: true });
          audioBuffer.appendBuffer(audioBytes);
        });
        log("append-audio" + i + " buffered=" + ranges(video.buffered));
      }
      if (i < videoRepeats) {
        videoBuffer.timestampOffset = i * videoDuration;
        await new Promise((resolve, reject) => {
          videoBuffer.addEventListener("updateend", resolve, { once: true });
          videoBuffer.addEventListener("error", reject, { once: true });
          videoBuffer.appendBuffer(videoBytes);
        });
        log("append-video" + i + " buffered=" + ranges(video.buffered));
      }
      if (i === 2) {
        try {
          await video.play();
          log("early-play=resolved");
        } catch (e) {
          log("early-play=rejected " + e.name + ":" + e.message);
        }
      }
    }
    const end = Math.max(bufferEnd(audioBuffer), bufferEnd(videoBuffer),
      video.buffered.length ? video.buffered.end(video.buffered.length - 1) : 2);
    mediaSource.duration = end + 0.25;
    mediaSource.endOfStream();
    state("before-play");
    await video.play();
    log("play-promise=resolved");
    const start = video.currentTime;
    for (let i = 0; i < 36; i++) {
      await new Promise(resolve => setTimeout(resolve, 500));
      state("tick" + i);
    }
    keepPressure = false;
    log("RESULT " + (video.currentTime > start + 8 && !video.error ? "pass" : "fail"));
  } catch (e) {
    keepPressure = false;
    log("RESULT fail exception=" + e.name + ":" + e.message);
  }
})();
</script>
