<!doctype html>
<meta charset="utf-8">
<title>xv6 direct video probe</title>
<video id="v" muted autoplay playsinline controls width="640" height="360"></video>
<pre id="out"></pre>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const asset = params.get("asset") || "long-test.mp4";
  const out = document.getElementById("out");
  const video = document.getElementById("v");
  const lines = [];
  function log(line) {
    lines.push(line);
    console.log("VIDEO-DIRECT " + line);
    out.textContent = lines.join("\n");
  }
  function ranges(r) {
    const a = [];
    for (let i = 0; i < r.length; i++)
      a.push(r.start(i).toFixed(3) + "-" + r.end(i).toFixed(3));
    return a.join("|");
  }
  function state(tag) {
    log(tag + " paused=" + video.paused + " ready=" + video.readyState +
      " network=" + video.networkState + " time=" + video.currentTime.toFixed(3) +
      " duration=" + video.duration + " buffered=" + ranges(video.buffered) +
      " error=" + (video.error ? video.error.code : 0));
  }
  ["loadstart", "loadedmetadata", "loadeddata", "canplay", "playing", "waiting",
   "stalled", "timeupdate", "pause", "ended", "error"].forEach(ev => {
    video.addEventListener(ev, () => state("event:" + ev));
  });
  try {
    video.src = asset;
    state("before-play");
    await video.play();
    log("play-promise=resolved asset=" + asset);
    const start = video.currentTime;
    for (let i = 0; i < 30; i++) {
      await new Promise(resolve => setTimeout(resolve, 500));
      state("tick" + i);
    }
    log("RESULT " + (video.currentTime > start + 8 && !video.error ? "pass" : "fail"));
  } catch (e) {
    log("RESULT fail exception=" + e.name + ":" + e.message);
  }
})();
</script>
