# Minimal ALSA configuration for the xv6 GUI image.
#
# The kernel currently exposes playback through the OSS-compatible /dev/dsp
# frontend backed by virtio-sound. Route ALSA's default PCM through libasound's
# built-in plug and file plugins so ALSA clients can write raw PCM to /dev/dsp
# without needing the full /dev/snd control/PCM character-device ABI yet.

defaults.pcm.card 0
defaults.pcm.device 0
defaults.pcm.subdevice -1
defaults.ctl.card 0

pcm.hw {
    @args [ CARD DEV SUBDEV ]
    @args.CARD {
        type integer
        default 0
    }
    @args.DEV {
        type integer
        default 0
    }
    @args.SUBDEV {
        type integer
        default -1
    }
    type hw
    card $CARD
    device $DEV
    subdevice $SUBDEV
}

ctl.hw {
    @args [ CARD ]
    @args.CARD {
        type integer
        default 0
    }
    type hw
    card $CARD
}

pcm.xv6_dsp {
    type file
    slave.pcm {
        type null
    }
    file "/dev/dsp"
    format "raw"
}

pcm.!default {
    type plug
    slave.pcm "xv6_dsp"
}

pcm.default {
    type plug
    slave.pcm "xv6_dsp"
}

ctl.!default {
    type empty
}

ctl.default {
    type empty
}
