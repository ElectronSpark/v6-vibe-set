<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <listen>unix:abstract=xv6_session_bus</listen>
  <auth>EXTERNAL</auth>
  <standard_session_servicedirs />

  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
    <allow send_type="method_return" send_requested_reply="true"/>
    <allow send_type="method_return" send_requested_reply="false"/>
    <allow send_type="error" send_requested_reply="true"/>
    <allow send_type="error" send_requested_reply="false"/>
    <allow receive_type="method_return" receive_requested_reply="true"/>
    <allow receive_type="method_return" receive_requested_reply="false"/>
    <allow receive_type="error" receive_requested_reply="true"/>
    <allow receive_type="error" receive_requested_reply="false"/>
    <allow eavesdrop="true"/>
  </policy>

  <limit name="max_incoming_bytes">33554432</limit>
  <limit name="max_outgoing_bytes">33554432</limit>
  <limit name="max_incoming_unix_fds">16</limit>
  <limit name="max_outgoing_unix_fds">16</limit>
  <limit name="max_message_size">33554432</limit>
  <limit name="max_message_unix_fds">16</limit>
  <limit name="max_completed_connections">64</limit>
  <limit name="max_incomplete_connections">16</limit>
  <limit name="max_connections_per_user">64</limit>
  <limit name="max_names_per_connection">128</limit>
  <limit name="max_match_rules_per_connection">128</limit>
</busconfig>
